name: ink_escape
description: A hand-drawn journey. Native Android and iOS Flutter and Flame game.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flame: 1.38.2
  flame_audio: 2.12.2
  shared_preferences: 2.5.6
  cupertino_icons: ^2.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/audio/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
